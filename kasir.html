<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Terminal Kasir (Responsive Mode)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Sembunyikan scrollbar bawaan browser agar UI terlihat seperti aplikasi native */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 font-sans h-screen flex flex-col overflow-hidden text-slate-900 selection:bg-emerald-500 selection:text-white">

    <header class="bg-slate-900 text-white p-3 sm:p-4 shadow-md flex flex-col md:flex-row justify-between items-center gap-3 shrink-0">
        <div class="flex items-center gap-2">
            <span class="text-xl">🛒</span>
            <h1 class="text-base sm:text-lg font-black tracking-wider uppercase text-emerald-400">POS TERMINAL KASIR OPERASIONAL</h1>
        </div>
        
        <div class="flex flex-wrap items-center justify-center md:justify-end gap-2 w-full md:w-auto text-xs">
            <div class="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-2 font-mono">
                <span class="text-slate-400">KASIR:</span>
                <span id="active-cashier-label" class="font-bold text-white">Kasir 1</span>
            </div>
            <div class="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-2 font-mono">
                <span class="text-slate-400">SHIFT:</span>
                <span id="active-shift-label" class="font-bold text-amber-400">SF-01</span>
            </div>
            <div class="flex gap-1">
                <button onclick="triggerModalBukaShift()" class="bg-blue-600 hover:bg-blue-700 font-black px-3 py-1.5 rounded-lg text-white transition active:scale-95 cursor-pointer">Buka Shift</button>
                <button onclick="triggerModalTutupShift()" class="bg-rose-600 hover:bg-rose-700 font-black px-3 py-1.5 rounded-lg text-white transition active:scale-95 cursor-pointer">Tutup Shift</button>
            </div>
        </div>
    </header>

    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-3 sm:p-4 overflow-y-auto lg:overflow-hidden min-h-0">
        
        <div class="lg:col-span-7 bg-white p-4 rounded-xl shadow-xs border border-slate-200 flex flex-col min-h-[400px] lg:min-h-0 overflow-hidden">
            
            <div class="flex gap-2 mb-4 shrink-0">
                <div class="relative flex-1">
                    <span class="absolute left-3 top-3 text-slate-400 text-sm">🔍</span>
                    <input type="text" id="pos-search-input" oninput="jalankanFilterCariProduk()" placeholder="Scan barcode atau ketik nama barang..." class="w-full border border-slate-200 pl-9 pr-4 py-2 rounded-lg bg-slate-50 focus:outline-none focus:border-emerald-500 font-medium text-sm">
                </div>
                <button onclick="bersihkanPencarianPOS()" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg text-xs font-bold transition active:scale-95 cursor-pointer">Clear</button>
            </div>

            <div class="flex-1 overflow-y-auto no-scrollbar pr-1">
                <h3 class="text-xs font-black text-slate-400 uppercase tracking-wider mb-2">Hasil Katalog Barang:</h3>
                <div id="catalog-products-container" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    </div>
            </div>
        </div>

        <div class="lg:col-span-5 bg-white p-4 rounded-xl shadow-xs border border-slate-200 flex flex-col min-h-[350px] lg:min-h-0 overflow-hidden">
            <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-100 shrink-0">
                <h2 class="text-xs font-black text-slate-700 uppercase tracking-widest flex items-center gap-1">
                    <span>🛒</span> Keranjang Kasir Aktif
                </h2>
                <button onclick="kosongkanKeranjangTotal()" class="text-[11px] text-rose-500 font-bold hover:underline cursor-pointer">Hold / Void Semua</button>
            </div>

            <div id="cart-items-wrapper" class="flex-1 overflow-y-auto no-scrollbar pr-1 space-y-2 divide-y divide-slate-50 text-xs">
                <div class="text-center py-12 text-slate-400 italic">Keranjang belanja kosong. Silakan ketuk produk di sebelah kiri.</div>
            </div>

            <div class="mt-4 pt-3 border-t-2 border-dashed border-slate-200 space-y-3 shrink-0">
                <div class="flex justify-between items-center bg-emerald-50 p-3 rounded-lg border border-emerald-100">
                    <span class="text-xs font-bold text-emerald-800 uppercase tracking-wider">TOTAL NOTA:</span>
                    <span class="text-xl font-black text-emerald-700 font-mono" id="label-grand-total">Rp 0</span>
                </div>

                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div>
                        <label class="block text-slate-500 font-bold mb-1">Metode Bayar:</label>
                        <select id="pos-payment-method" class="w-full border border-slate-200 p-2 rounded-lg bg-slate-50 font-bold text-sm focus:outline-none">
                            <option value="TUNAI">💵 TUNAI (Cash)</option>
                            <option value="QRIS">📱 QRIS / E-Wallet</option>
                            <option value="TRANSFER">🏦 DEBIT / TRANSFER</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-500 font-bold mb-1">Uang Jual / Bayar (Rp):</label>
                        <input type="number" id="pos-cash-received" oninput="hitungKembalianUangKasir()" value="0" class="w-full border border-slate-200 p-2 rounded-lg font-mono font-bold text-sm bg-slate-50 focus:outline-none focus:border-emerald-500 text-right">
                    </div>
                </div>

                <div class="flex justify-between items-center text-xs px-1 text-slate-600 font-medium">
                    <span>Uang Kembalian Sisa:</span>
                    <span id="label-cash-change" class="font-mono font-bold text-slate-900">Rp 0</span>
                </div>

                <button onclick="eksekusiCheckoutTransaksi()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl transition uppercase text-xs tracking-widest shadow-md cursor-pointer active:scale-[0.99]">
                    💸 BAYAR & POTONG STOK
                </button>
            </div>

        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyeGe0Z_vWqJU4BrJmn872SJMXZEG2MmsLlW9Hr8p8l0jvoMqqV201QnoPc6-kM6WII/exec";
        let masterProduk = [];
        let keranjangBelanja = [];
        let dataOperatorShift = { cashier_name: "Kasir 1", shift_id: "SF-01" };

        async function muatKatalogProdukDariDatabase() {
            try {
                const res = await fetch(`${API_URL}?action=getProduk`, { method: "GET" });
                masterProduk = await res.json();
                renderKatalogProduk(masterProduk);
            } catch (e) { alert("Gagal mengambil data produk cloud!"); }
        }

        function renderKatalogProduk(arr) {
            const container = document.getElementById('catalog-products-container');
            container.innerHTML = '';
            if(arr.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-6 text-slate-400 italic">Produk tidak ditemukan...</div>`;
                return;
            }
            arr.forEach(p => {
                let badgeColor = p.stock <= 0 ? 'bg-rose-100 text-rose-700' : p.stock <= 10 ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700';
                container.innerHTML += `
                    <div onclick="tambahKeKeranjangBelanja('${p.barcode}')" class="bg-slate-50 hover:bg-slate-100 border border-slate-200 p-2.5 rounded-xl flex flex-col justify-between cursor-pointer transition active:scale-95 shadow-2xs select-none">
                        <div>
                            <span class="block text-[10px] font-mono text-slate-400 mb-0.5">${p.barcode}</span>
                            <h4 class="text-xs font-bold text-slate-800 line-clamp-2">${p.product_name}</h4>
                        </div>
                        <div class="flex justify-between items-center mt-2 pt-1 border-t border-slate-100">
                            <span class="font-mono font-bold text-indigo-700 text-xs">Rp ${parseInt(p.selling_price).toLocaleString('id-ID')}</span>
                            <span class="text-[9px] font-black px-1.5 py-0.5 rounded-md ${badgeColor}">${p.stock} Pcs</span>
                        </div>
                    </div>`;
            });
        }

        function jalankanFilterCariProduk() {
            const keyword = document.getElementById('pos-search-input').value.toLowerCase().trim();
            const hasilSaring = masterProduk.filter(p => p.product_name.toLowerCase().includes(keyword) || p.barcode.includes(keyword));
            renderKatalogProduk(hasilSaring);
        }

        function bersihkanPencarianPOS() {
            document.getElementById('pos-search-input').value = '';
            renderKatalogProduk(masterProduk);
        }

        function tambahKeKeranjangBelanja(barcode) {
            const produk = masterProduk.find(p => p.barcode === barcode);
            if (!produk || produk.stock <= 0) return alert("Barang tidak valid atau stok rak habis!");
            
            const itemDiKeranjang = keranjangBelanja.find(item => item.barcode === barcode);
            if (itemDiKeranjang) {
                if (itemDiKeranjang.quantity >= produk.stock) return alert("Batas maksimal pembelian sesuai sisa stok rak gudang!");
                itemDiKeranjang.quantity += 1;
            } else {
                keranjangBelanja.push({ ...produk, quantity: 1 });
            }
            hitungUlangStrukturKeranjang();
        }

        function ubahKuantitasItem(barcode, jumlah) {
            const item = keranjangBelanja.find(i => i.barcode === barcode);
            if (!item) return;
            item.quantity += jumlah;
            if (item.quantity <= 0) {
                keranjangBelanja = keranjangBelanja.filter(i => i.barcode !== barcode);
            }
            hitungUlangStrukturKeranjang();
        }

        function kosongkanKeranjangTotal() {
            keranjangBelanja = [];
            hitungUlangStrukturKeranjang();
        }

        function hitungUlangStrukturKeranjang() {
            const wrapper = document.getElementById('cart-items-wrapper');
            wrapper.innerHTML = '';
            
            if (keranjangBelanja.length === 0) {
                wrapper.innerHTML = `<div class="text-center py-12 text-slate-400 italic">Keranjang belanja kosong. Silakan ketuk produk di sebelah kiri.</div>`;
                document.getElementById('label-grand-total').innerText = "Rp 0";
                document.getElementById('label-cash-change').innerText = "Rp 0";
                return;
            }

            let grandTotal = 0;
            keranjangBelanja.forEach(item => {
                let subTotal = item.selling_price * item.quantity;
                grandTotal += subTotal;
                wrapper.innerHTML += `
                    <div class="flex items-center justify-between py-2 gap-2">
                        <div class="flex-1 min-w-0">
                            <span class="font-bold text-slate-800 block truncate">${item.product_name}</span>
                            <span class="text-slate-400 font-mono text-[10px]">@Rp ${parseInt(item.selling_price).toLocaleString('id-ID')} x ${item.quantity}</span>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            <button onclick="ubahKuantitasItem('${item.barcode}', -1)" class="bg-slate-100 hover:bg-slate-200 w-5 h-5 font-bold rounded flex items-center justify-center cursor-pointer text-xs">-</button>
                            <span class="font-mono font-bold w-4 text-center">${item.quantity}</span>
                            <button onclick="ubahKuantitasItem('${item.barcode}', 1)" class="bg-slate-100 hover:bg-slate-200 w-5 h-5 font-bold rounded flex items-center justify-center cursor-pointer text-xs">+</button>
                        </div>
                        <span class="font-mono font-bold text-slate-700 text-right w-16 shrink-0">Rp ${parseInt(subTotal).toLocaleString('id-ID')}</span>
                    </div>`;
            });

            document.getElementById('label-grand-total').innerText = `Rp ${grandTotal.toLocaleString('id-ID')}`;
            hitungKembalianUangKasir();
        }

        function hitungKembalianUangKasir() {
            let total = 0;
            keranjangBelanja.forEach(i => total += (i.selling_price * i.quantity));
            let bayar = parseInt(document.getElementById('pos-cash-received').value || 0);
            let sisa = bayar - total;
            document.getElementById('label-change-change');
            document.getElementById('label-cash-change').innerText = sisa < 0 ? "Uang Kurang!" : `Rp ${sisa.toLocaleString('id-ID')}`;
        }

        function eksekusiCheckoutTransaksi() {
            if (keranjangBelanja.length === 0) return alert("Keranjang belanja masih kosong!");
            
            let total = 0;
            keranjangBelanja.forEach(i => total += (i.selling_price * i.quantity));
            let bayar = parseInt(document.getElementById('pos-cash-received').value || 0);
            let metode = document.getElementById('pos-payment-method').value;
            if (metode === "TUNAI" && bayar < total) return alert("Uang pembayaran tunai yang dimasukkan kurang!");

            const payload = {
                action: "checkout",
                cashier_name: dataOperatorShift.cashier_name,
                shift_id: dataOperatorShift.shift_id,
                grand_total: total,
                payment_method: metode,
                cart: keranjangBelanja
            };

            document.body.classList.add("pointer-events-none", "opacity-50");
            toggleLoading(true);

            fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(res => {
                document.body.classList.remove("pointer-events-none", "opacity-50");
                toggleLoading(false);
                if(res.success) {
                    alert(`Transaksi Sukses Terkunci!\nNomor Invoice: ${res.invoice}`);
                    kosongkanKeranjangTotal();
                    document.getElementById('pos-cash-received').value = 0;
                    muatKatalogProdukDariDatabase();
                } else { alert(res.message); }
            }).catch(() => { document.body.classList.remove("pointer-events-none", "opacity-50"); toggleLoading(false); });
        }

        // SIMULASI AKSI MANAJEMEN SHIFT OPERASIONAL KASIR
        function triggerModalBukaShift() {
            let nama = prompt("Masukkan Nama Staff Kasir:", dataOperatorShift.cashier_name);
            let idShift = prompt("Masukkan ID/Kode Shift Kerja (Contoh: SF-01):", dataOperatorShift.shift_id);
            let modal = prompt("Masukkan Besaran Uang Modal Awal Laci Kasir (Rp):", "500000");
            
            if(!nama || !idShift || !modal) return alert("Gagal memproses buka shift! Seluruh data input wajib terisi.");
            
            const payload = { action: "bukaShift", cashier_name: nama, shift_id: idShift, starting_cash: modal };
            toggleLoading(true);

            fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(r => r.json())
            .then(res => {
                toggleLoading(false);
                if(res.success) {
                    dataOperatorShift.cashier_name = nama;
                    dataOperatorShift.shift_id = idShift;
                    document.getElementById('active-cashier-label').innerText = nama;
                    document.getElementById('active-shift-label').innerText = idShift;
                    alert(res.message);
                } else { alert(res.message); }
            }).catch(() => toggleLoading(false));
        }

        function triggerModalTutupShift() {
            let uangLaci = prompt("Masukkan Total Perhitungan Uang Fisik Aktual di Dalam Laci (Rp):", "500000");
            if(!uangLaci) return alert("Proses penutupan shift dibatalkan.");

            const payload = {
                action: "tutupShift",
                cashier_name: dataOperatorShift.cashier_name,
                shift_id: dataOperatorShift.shift_id,
                actual_cash: uangLaci
            };
            toggleLoading(true);

            fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(r => r.json())
            .then(res => {
                toggleLoading(false);
                alert(res.message);
            }).catch(() => toggleLoading(false));
        }

        window.addEventListener('DOMContentLoaded', muatKatalogProdukDariDatabase);
    </script>
</body>
</html>
