<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Center (Dashboard Mode)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen text-slate-900">

    <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center media-no-print">
        <h1 class="text-lg font-bold">👑 ADMIN CONTROL CENTER</h1>
        <button onclick="muatDataLaporanSistem(true)" class="bg-indigo-700 px-3 py-1.5 rounded text-xs font-bold cursor-pointer">🔄 Refresh Data</button>
    </header>

    <div class="p-6 max-w-7xl mx-auto space-y-6">
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex flex-col min-h-[24rem]">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xs font-black uppercase text-amber-800">Laporan Rekap Shift</h2>
                <div class="flex gap-2">
                    <input type="date" id="filter-shift-date" onchange="renderTabelRekapShift()" class="border p-1 text-xs font-mono">
                    <button onclick="unduhLaporanHarianExcel()" class="bg-emerald-600 text-white px-2 py-1 rounded text-xs font-bold">🟢 Excel</button>
                    <button onclick="unduhLaporanHarianPDF()" class="bg-rose-600 text-white px-2 py-1 rounded text-xs font-bold">📥 PDF</button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto no-scrollbar">
                <table id="table-summary-excel-target" class="w-full text-left text-[10px] border-collapse bg-indigo-50/40">
                    <thead>
                        <tr class="bg-indigo-100 font-bold border-b border-indigo-200">
                            <th class="p-2">Nama Kasir</th>
                            <th class="p-2 text-right">Modal</th>
                            <th class="p-2 text-right text-emerald-800">Laci</th>
                        </tr>
                    </thead>
                    <tbody id="table-summary-kasir-body">
                        <tr><td colspan="3" class="text-center py-4 text-slate-500">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // PASTIKAN URL INI ADALAH URL DEPLOYMENT GOOGLE APPS SCRIPT ANDA
        const API_URL = "https://script.google.com/macros/s/AKfycbwyWjLnncrQMhpd-zT2xRZqPFhN_0b9hKWcTDyqch2vQexrsnuZULJkSbOWRTGER6mi/exec";
        let globalDataShifts = [];

        async function muatDataLaporanSistem(pakeSpinner = false) {
            try {
                const res = await fetch(`${API_URL}?action=getLaporanAdmin`, { method: 'GET', mode: 'cors' });
                
                if (!res.ok) throw new Error("Gagal terhubung ke server (HTTP " + res.status + ")");
                
                const txt = await res.text();
                const result = JSON.parse(txt);
                
                if (result.success || result.shifts) {
                    globalDataShifts = result.shifts || [];
                    renderTabelRekapShift();
                } else {
                    throw new Error("Format data tidak valid.");
                }
            } catch (error) {
                // PESAN DEBUG: Ini akan muncul jika ada masalah koneksi
                alert("Gagal memuat data: " + error.message + "\n\nPastikan URL Deployment Google Apps Script sudah benar dan diset 'Anyone'.");
                console.error(error);
            }
        }

        function renderTabelRekapShift() {
            const summaryBody = document.getElementById('table-summary-kasir-body');
            summaryBody.innerHTML = '';
            
            const tanggalTarget = document.getElementById('filter-shift-date').value.trim(); 
            if (!tanggalTarget) return;

            const dataTerfilter = globalDataShifts.filter(s => {
                let waktuAsli = s.tanggal || s.start_time || s.waktu_buka || "";
                return waktuAsli.toString().includes(tanggalTarget);
            });
            
            if (dataTerfilter.length === 0) {
                summaryBody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-slate-400 italic">Tidak ada data untuk tanggal ini.</td></tr>`;
                return;
            }

            let ringkasanKasirMap = {};
            dataTerfilter.forEach(s => {
                let modal = parseInt(s.starting_cash || 0, 10);
                let laci = parseInt(s.actual_cash || 0, 10);
                if (!ringkasanKasirMap[s.cashier_name]) ringkasanKasirMap[s.cashier_name] = { m: 0, l: 0 };
                ringkasanKasirMap[s.cashier_name].m += modal;
                ringkasanKasirMap[s.cashier_name].l += laci;
            });

            for (let k in ringkasanKasirMap) {
                summaryBody.innerHTML += `<tr><td class="p-2 font-bold">${k}</td><td class="p-2 text-right">Rp ${ringkasanKasirMap[k].m.toLocaleString()}</td><td class="p-2 text-right">Rp ${ringkasanKasirMap[k].l.toLocaleString()}</td></tr>`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => muatDataLaporanSistem(true));
    </script>
</body>
</html>
